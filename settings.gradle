pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'MVX'
// app 是唯一的可安装模块；core / core-compose 是共享模块；六个架构库互不依赖，只依赖共享模块
include ':app', ':core', ':core-compose'
include ':mvc', ':mvp', ':mvvm', ':mvi', ':udf', ':mv'
